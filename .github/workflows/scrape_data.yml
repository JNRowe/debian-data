name: Scrape Debian package list data

on:
  push:
    paths:
      - ".github/workflows/scrape_data.yml"
      - "fetch_apt_lists"
  workflow_dispatch:
  schedule:
    - cron: "11 19 * * *"

permissions:
  contents: write

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Cache ETag data for fetcher
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ runner.os }}-${{ hashFiles('.github/workflows/scrape_data.yml', 'fetch_apt_lists') }}
          path: .etags/

      - name: Install utilities
        run: |-
          sudo eatmydata apt-get -qq install --no-install-recommends zsh

      - name: Fetch package list data
        id: fetch_data
        run: |-
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT
          ./fetch_apt_lists
          echo "end_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Commit, if changed
        id: commit
        env:
          FETCH_END_TIME: ${{ steps.fetch_data.outputs.end_time }}
          FETCH_START_TIME: ${{ steps.fetch_data.outputs.start_time }}
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all bookworm/ bullseye/ trixie/ forky/
          if ! git diff --staged --quiet; then
            modified_count=$(git status --porcelain bookworm/ bullseye/ trixie/ forky/ |
              grep -c '\.pkgs$' || :)
            runtime=$(( FETCH_END_TIME - FETCH_START_TIME ))
            git commit \
              -m "Update package lists ($(date -u +%FT%H:%M))" \
              --trailer "X-modified-lists: $modified_count" \
              --trailer "X-runtime: ${runtime}s"
            echo changed=true >> $GITHUB_OUTPUT
          fi

      - name: Push on main
        if: github.ref_name == 'main' && steps.commit.outputs.changed == 'true'
        run: |-
          git push

      - name: Upload logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: logs
          path: logs/
          if-no-files-found: ignore
